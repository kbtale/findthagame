name: Repogee Leaderboard

on:
  pull_request:
    types: [opened, closed]
  issues:
    types: [opened, closed]
  issue_comment:
    types: [created]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gamify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Repogee Leaderboard
        uses: kbtale/repogee@main
