name: 💡 Feature Request
description: Suggest an idea, new filter, UI enhancement, or improvement for FindThaGame
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a feature or improvement for FindThaGame!
  - type: input
    id: feature-title
    attributes:
      label: Feature Summary
      description: A brief summary of the proposed feature.
      placeholder: "e.g., Add multi-select filter for game perspectives (First-person, Isometric)"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation you are encountering.
      placeholder: "e.g., I often remember games by camera style, but currently perspective filtering is limited to..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: "e.g., Add a dropdown in the filters dialog to select multiple perspective tags..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any mockups, screenshots, or references to other tools.
    validations:
      required: false
